<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Críticas Gastronômicas Dramáticas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Crítico Dramático 🍷</h1>
        <p>Gere uma críticas completas bem específicas!</p>
        
        <div class="actions">
            <button id="btnGerarTudo" class="btn-main">Gerar uma crítica bem específica 🎲</button>
        </div>

        <div id="resultado-area" class="resultado-area" style="display: none;">
            <div class="bloco-frase">
                <div class="linha-parte">
                    <span class="label">Sujeito:</span>
                    <span id="texto-sujeito" class="texto-parte"></span>
                    <button class="btn-resortear" onclick="resortearParte('sujeito')">Girar 🎲</button>
                </div>

                <div class="linha-parte">
                    <span class="label">Descrição:</span>
                    <span id="texto-descricao" class="texto-parte"></span>
                    <button class="btn-resortear" onclick="resortearParte('descricao')">Girar 🎲</button>
                </div>

                <div class="linha-parte">
                    <span class="label">Ação:</span>
                    <span id="texto-acaoTextura" class="texto-parte"></span>
                    <button class="btn-resortear" onclick="resortearParte('acaoTextura')">Girar 🎲</button>
                </div>
            </div>

            <div class="frase-final-container">
                <p><strong>Frase Completa:</strong></p>
                <blockquote id="frase-completa" class="texto-parte"></blockquote>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
